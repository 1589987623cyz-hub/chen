00' y='299' font-size='12' font-weight='400' font-family='Menlo,monospace'>so two overlapping petals differ by the same height everywhere.</text><text x='100' y='320' font-size='12' font-weight='400' font-family='Menlo,monospace'></text><text x='100' y='341' font-size='12' font-weight='400' font-family='Menlo,monospace'>Petals in one sector and zone move together and keep</text><text x='100' y='362' font-size='12' font-weight='400' font-family='Menlo,monospace'>  1.0 top to top. Across groups: 2.5.</text><text x='100' y='383' font-size='12' font-weight='400' font-family='Menlo,monospace'>Highest point above the sculpted shell: 20.1</text><text x='100' y='404' font-size='12' font-weight='400' font-family='Menlo,monospace'>Highest point above the base surface: 22.6</text><text x='100' y='425' font-size='12' font-weight='400' font-family='Menlo,monospace'>Smallest gap with a petal pushed in: 0.09</text><text x='100' y='446' font-size='12' font-weight='400' font-family='Menlo,monospace'></text><text x='100' y='467' font-size='12' font-weight='400' font-family='Menlo,monospace'>Every vertex: shellAt(U/a, V/b) + n·(relief + offset)</text><g font-family='Helvetica,Arial,sans-serif'><rect x='10' y='10' width='1380' height='980' fill='none' stroke='#111' stroke-width='1.5'/><rect x='950' y='910' width='440' height='80' fill='#fff' stroke='#111'/><text x='960' y='938' font-size='18' font-weight='700'>05  PETAL STACK-UP (10×)</text><text x='960' y='960' font-size='12' fill='#666'>Not to overall scale: stack drawn 10×</text><text x='960' y='978' font-size='11' fill='#666'>EX-SENSE / RC5 · units mm · 3.2px = 1mm · generated by generate.py</text></g></svg>